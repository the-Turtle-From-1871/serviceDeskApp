name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write # allow uploading the Semgrep SARIF to the Security tab

jobs:
  # --- Static Application Security Testing -------------------------------------
  sast:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Run Semgrep from its official image (a known-good Python env — sidesteps the
    # setuptools/pkg_resources breakage a pipx install hits on the runner's
    # Python 3.12) via `docker run`. checkout + upload-sarif stay on the HOST
    # runner (glibc), so the JS-based actions never execute inside the container
    # and there is no musl/glibc mismatch.
    env:
      SEMGREP_IMAGE: semgrep/semgrep:1.90.0
      # Curated, token-free registry rulesets (no Semgrep AppSec account needed).
      # Folded to one line; the shell word-splits it into flags.
      SEMGREP_CONFIGS: >-
        --config p/security-audit --config p/secrets --config p/javascript
        --config p/typescript --config p/react --config p/owasp-top-ten
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Semgrep scan (SARIF, informational)
        # SARIF is written into the mounted workspace so the host upload step finds it.
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" \
            semgrep scan $SEMGREP_CONFIGS \
              --sarif --output semgrep.sarif \
              --metrics off

      - name: Upload SARIF
        # Skip on forked PRs, whose read-only GITHUB_TOKEN can't write security-events.
        if: >-
          always() &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Semgrep gate (fail on ERROR severity)
        # Blocking gate: only ERROR-severity findings fail the build, so the
        # baseline stays clean without low-severity/accepted-by-design noise
        # permanently reddening the pipeline. Full findings are in the SARIF above.
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" \
            semgrep scan $SEMGREP_CONFIGS \
              --severity ERROR \
              --error \
              --metrics off

  # --- Compile / build gate ----------------------------------------------------
  build:
    name: Build (next build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Dummy values keep Prisma client instantiation + Auth.js config from
        # throwing at build time. `next build` never opens a DB connection for
        # dynamic (auth/cookie/searchParam-driven) routes, which is all of them.
        # If a route is ever statically prerendered against the DB, wire a real
        # DATABASE_URL secret here instead.
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
          AUTH_SECRET: ci-placeholder-secret-not-used-at-runtime
          APP_URL: http://localhost:3000
        run: npm run build

  # --- Test suite --------------------------------------------------------------
  # Most of this suite is DB-backed (service/integration tests that TRUNCATE and
  # reseed), so it needs a real Postgres rather than a mock. It is the gate the
  # other two jobs cannot be: Semgrep and `next build` both pass on a branch whose
  # tests are red, which is exactly how a broken assertion once merged and stayed
  # red on main.
  test:
    name: Tests (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # 16 to match docker-compose.yml and Supabase. The official image ships
        # contrib, which is what supplies citext, pg_trgm and pgcrypto — the
        # migrations create all three and fail without them.
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # The name is load-bearing, not cosmetic: tests/helpers/db.ts refuses
          # to TRUNCATE unless DATABASE_URL contains "handreceipt_test". That
          # guard is what stops the suite ever pointing at a real database, so
          # the CI database has to satisfy it too.
          POSTGRES_DB: handreceipt_test
        ports:
          - 5432:5432
        # Without a health gate the first test file races the server's startup
        # and fails with ECONNREFUSED rather than anything meaningful.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        # There is no postinstall hook, and `npm test` does not generate (only
        # `npm run build` does), so without this every test importing
        # @prisma/client fails to resolve.
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/handreceipt_test?schema=public
        run: npx prisma generate

      - name: Write .env.test
        # tests/helpers/setup-env.ts loads `.env.test` with `override: true`,
        # so this file — not the job env — is what the suite actually reads.
        # Turnstile and the Redis rate-limit store are deliberately left unset:
        # both are documented to no-op when unconfigured, which is how CI and a
        # fresh dev machine keep working.
        run: |
          cat > .env.test <<'EOF'
          DATABASE_URL="postgresql://postgres:postgres@localhost:5432/handreceipt_test?schema=public"
          DIRECT_URL="postgresql://postgres:postgres@localhost:5432/handreceipt_test?schema=public"
          AUTH_SECRET="ci-placeholder-secret-not-used-outside-ci"
          APP_URL="http://localhost:3000"
          EOF

      - name: Run tests
        # tests/helpers/global-setup.ts shells out to `prisma migrate deploy`
        # ONCE per run, against a template database, before cloning it per
        # worker — not per DB-backed file. prisma.config.ts reads DIRECT_URL ??
        # DATABASE_URL, so both must be set above AND both are overridden by
        # global-setup.ts's execSync call for the same reason (see the comment
        # there) — otherwise the migration lands on the un-cloned
        # `handreceipt_test` database instead of the template.
        run: npm test
