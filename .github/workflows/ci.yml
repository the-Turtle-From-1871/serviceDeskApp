name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write # allow uploading the Semgrep SARIF to the Security tab

jobs:
  # --- Static Application Security Testing -------------------------------------
  sast:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Semgrep
        # Run on the host runner (glibc) rather than the Alpine/musl semgrep image,
        # so the JS-based checkout/upload actions run without a libc mismatch.
        # pipx is preinstalled on GitHub-hosted ubuntu runners.
        run: pipx install semgrep==1.90.0

      # Curated, token-free registry rulesets (no Semgrep AppSec account needed).
      # All six packs resolve to real rule sets.
      - name: Semgrep scan (SARIF, informational)
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/secrets \
            --config p/javascript \
            --config p/typescript \
            --config p/react \
            --config p/owasp-top-ten \
            --sarif --output semgrep.sarif \
            --metrics off

      - name: Upload SARIF
        # Skip on forked PRs, whose read-only GITHUB_TOKEN can't write security-events.
        if: >-
          always() &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Semgrep gate (fail on ERROR severity)
        # Blocking gate: only ERROR-severity findings fail the build, so the
        # baseline stays clean without low-severity/accepted-by-design noise
        # permanently reddening the pipeline. Full findings are in the SARIF above.
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/secrets \
            --config p/javascript \
            --config p/typescript \
            --config p/react \
            --config p/owasp-top-ten \
            --severity ERROR \
            --error \
            --metrics off

  # --- Compile / build gate ----------------------------------------------------
  build:
    name: Build (next build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Dummy values keep Prisma client instantiation + Auth.js config from
        # throwing at build time. `next build` never opens a DB connection for
        # dynamic (auth/cookie/searchParam-driven) routes, which is all of them.
        # If a route is ever statically prerendered against the DB, wire a real
        # DATABASE_URL secret here instead.
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
          AUTH_SECRET: ci-placeholder-secret-not-used-at-runtime
          APP_URL: http://localhost:3000
        run: npm run build
