name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write # allow uploading the Semgrep SARIF to the Security tab

jobs:
  # --- Static Application Security Testing -------------------------------------
  sast:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Run Semgrep from its official image (a known-good Python env — sidesteps the
    # setuptools/pkg_resources breakage a pipx install hits on the runner's
    # Python 3.12) via `docker run`. checkout + upload-sarif stay on the HOST
    # runner (glibc), so the JS-based actions never execute inside the container
    # and there is no musl/glibc mismatch.
    env:
      SEMGREP_IMAGE: semgrep/semgrep:1.90.0
      # Curated, token-free registry rulesets (no Semgrep AppSec account needed).
      # Folded to one line; the shell word-splits it into flags.
      SEMGREP_CONFIGS: >-
        --config p/security-audit --config p/secrets --config p/javascript
        --config p/typescript --config p/react --config p/owasp-top-ten
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Semgrep scan (SARIF, informational)
        # SARIF is written into the mounted workspace so the host upload step finds it.
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" \
            semgrep scan $SEMGREP_CONFIGS \
              --sarif --output semgrep.sarif \
              --metrics off

      - name: Upload SARIF
        # Skip on forked PRs, whose read-only GITHUB_TOKEN can't write security-events.
        if: >-
          always() &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Semgrep gate (fail on ERROR severity)
        # Blocking gate: only ERROR-severity findings fail the build, so the
        # baseline stays clean without low-severity/accepted-by-design noise
        # permanently reddening the pipeline. Full findings are in the SARIF above.
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" \
            semgrep scan $SEMGREP_CONFIGS \
              --severity ERROR \
              --error \
              --metrics off

  # --- Security-doc guardrail --------------------------------------------------
  security-docs:
    name: Security docs current
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # PR-only: the check compares a branch against its merge base with main, which
    # is not a meaningful question for a push to main itself.
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        # Full history so the merge-base diff (base...HEAD) can be computed.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if security code changed without docs/SECURITY.md
        # Escape hatch for genuine no-op changes: put "[skip security-doc]" in a
        # commit message. See scripts/check-security-docs.mjs.
        #
        # `github.base_ref` goes through an intermediate env var rather than
        # `${{ }}` interpolation directly in `run:`. A branch name is attacker-
        # controlled on a fork PR, so interpolating it into the shell command is
        # a script-injection hole (semgrep run-shell-injection, sg.run/pkzk).
        # Quote the expansion.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-security-docs.mjs "origin/$BASE_REF"

  # --- Compile / build gate ----------------------------------------------------
  build:
    name: Build (next build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Dummy values keep Prisma client instantiation + Auth.js config from
        # throwing at build time. `next build` never opens a DB connection for
        # dynamic (auth/cookie/searchParam-driven) routes, which is all of them.
        # If a route is ever statically prerendered against the DB, wire a real
        # DATABASE_URL secret here instead.
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
          AUTH_SECRET: ci-placeholder-secret-not-used-at-runtime
          APP_URL: http://localhost:3000
        run: npm run build
